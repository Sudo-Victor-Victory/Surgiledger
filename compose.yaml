services:
  postgres:
    image: postgres:17
    container_name: surgiledger-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: surgiledger
      POSTGRES_PASSWORD: surgiledger
      POSTGRES_DB: surgiledger

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgiledger -d surgiledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
